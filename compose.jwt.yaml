services:
  markdownify:
    build:
      context: .
      dockerfile: Dockerfile.remote
    image: bryanmarty/markdownify-mcp:latest
    env_file: .env.jwt
    environment:
      MD_HOST: 0.0.0.0
      MD_PORT: 8000
      MD_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - markdownify-data:/data
      # Optional operator quota overrides; also set MD_QUOTA_OVERRIDES_FILE in .env.jwt.
      # - ./secrets/quota-overrides.json:/run/markdownify/quota-overrides.json:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
volumes:
  markdownify-data:

