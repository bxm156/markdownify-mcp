services:
  markdownify:
    build:
      context: .
      dockerfile: Dockerfile.remote
    image: bryanmarty/markdownify-mcp:latest
    env_file: .env.jwt
    environment:
      MD_JWT_PRINCIPALS_FILE: /run/markdownify/jwt-principals.json
      MD_HOST: 0.0.0.0
      MD_PORT: 8000
      MD_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - markdownify-data:/data
      - type: bind
        source: ./secrets/jwt-principals.json
        target: /run/markdownify/jwt-principals.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
volumes:
  markdownify-data:

