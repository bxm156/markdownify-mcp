name: Docker Hub publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: bryanmarty/markdownify-mcp
concurrency:
  group: dockerhub-main
  cancel-in-progress: false
jobs:
  test-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin the Node the smoke scripts and Node-subprocess tests spawn; the runner default drifts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Parity with remote-mvp.yml. Before the image is pushed, this job repeats the source checks that are
      # cheap or that exercise what ships: typecheck, MD_* docs check, assert guard, bash -n and shellcheck,
      # remote and full tests (MD_TEST_NETWORK=1), the converter, JWT and LiteLLM anonymous-health smokes,
      # the fixture generator test, the stdio smoke's response-waiting test, compose file validation, and the
      # candidate image with three isolated agents plus the upload-and-convert example.
      # It relies on remote-mvp.yml (which runs on the same commit) for the heavier or less relevant checks:
      # scripts/docker-smoke-test.sh (a second image build of the stdio Dockerfile, which is not published),
      # the single-key container smoke, and the LiteLLM -O run and negative-path harness (extra pip install and
      # server spawns for regressions in the test code, not in the image). Add a check to both files if it
      # should gate publishing.
      - name: Build and test source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
          bun scripts/check-env-docs.ts
          bun run build:remote
          bun test src/remote
          python -m pip install 'markitdown[pdf,docx,xlsx,pptx]==0.1.5'
          bun run build
          MD_TEST_NETWORK=1 bun test
          bun scripts/remote-converter-smoke.ts
          bun scripts/jwt-http-smoke.ts
          python -m pip install 'litellm[mcp]==1.104.0'
          python scripts/litellm-health-smoke.py
      - name: Reject assert statements in Python scripts (python -O strips them)
        run: |
          # Same check as remote-mvp.yml: parses each file, so the word in comments and strings is not flagged.
          python - scripts/*.py mkdocs_hooks.py <<'PY'
          import ast, sys
          found = [f"{path}:{node.lineno}" for path in sys.argv[1:]
                   for node in ast.walk(ast.parse(open(path, encoding="utf-8").read(), path))
                   if isinstance(node, ast.Assert)]
          for place in found:
              print(f"::error file={place.split(':')[0]},line={place.split(':')[1]}::Use an explicit raise instead of assert (python -O strips it)")
          sys.exit(1 if found else 0)
          PY
      - name: Check shell script syntax
        shell: bash
        run: for f in scripts/*.sh setup.sh; do bash -n "$f"; done
      - name: Lint shell scripts with shellcheck
        shell: bash
        run: shellcheck -x scripts/*.sh setup.sh
      - name: Test the stdio smoke test's response waiting (no Docker needed)
        run: bash scripts/docker-smoke-test.test.sh
      - name: Test the Office fixture generator (real DOCX, XLSX and PPTX files)
        run: |
          python scripts/create_remote_fixtures_test.py
          python -O scripts/create_remote_fixtures_test.py
      - name: Validate compose files
        shell: bash
        run: |
          set -euo pipefail
          # Same setup as remote-mvp.yml: Compose resolves env_file and bind sources, so use the documented
          # examples and a placeholder registry. .dockerignore keeps .env.* and secrets out of image builds.
          cp .env.remote.example .env.remote
          cp .env.multitenant.example .env.multitenant
          cp .env.jwt.example .env.jwt
          mkdir -p secrets
          printf '{"credentials":[]}\n' > secrets/agents.json
          for file in compose.remote.yaml compose.multitenant.yaml compose.jwt.yaml; do
            echo "Validating $file"
            docker compose -f "$file" config -q
          done
          # Remove the placeholders so the build context for the image stays as it was.
          rm -rf .env.remote .env.multitenant .env.jwt secrets
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate without registry credentials
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/amd64
          load: true
          push: false
          tags: markdownify-remote:publish-candidate
          build-args: VCS_REF=${{ github.sha }}
      - name: Prepare disposable agent credentials
        run: bun scripts/create-test-agent-registry.ts "$RUNNER_TEMP/markdownify-agents.json" "$GITHUB_ENV"
      - name: Test candidate container with three isolated agents
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f -v markdownify-publish-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name markdownify-publish-test -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/markdownify-agents.json:/run/markdownify-agents.json:ro" \
            -e MD_AUTH_FILE=/run/markdownify-agents.json \
            -e MD_PUBLIC_BASE_URL=http://localhost:8000 markdownify-remote:publish-candidate
          bash scripts/wait-for-container.sh markdownify-publish-test
          bun scripts/multitenant-http-smoke.ts
          # The documented streaming helper against the same multitenant container, as agent "a".
          # MD_TEST_AGENT_KEYS (JSON, masked) was exported by the registry step through GITHUB_ENV.
          example_output="$RUNNER_TEMP/upload-and-convert.md"
          agent_a_token="$(jq -r .a <<<"$MD_TEST_AGENT_KEYS")"
          MCP_TOKEN="$agent_a_token" CONVERSION_DEADLINE_MS=120000 \
            bun examples/upload-and-convert.ts src/sample-data/test.pdf "$example_output"
          grep -q 'Test PDF content' "$example_output"
          # The same helper under plain Node (no Bun, no src/), then the compiled copy inside the image.
          node_output="$RUNNER_TEMP/upload-and-convert-node.md"
          MCP_TOKEN="$agent_a_token" CONVERSION_DEADLINE_MS=120000 \
            node --experimental-strip-types --no-warnings examples/upload-and-convert.ts src/sample-data/test.pdf "$node_output"
          grep -q 'Test PDF content' "$node_output"
          MCP_TOKEN="$agent_a_token" docker run --rm --network container:markdownify-publish-test -e MCP_TOKEN -e CONVERSION_DEADLINE_MS=120000 \
            -v "$PWD/src/sample-data:/in:ro" markdownify-remote:publish-candidate \
            sh -c 'node examples/upload-and-convert.js /in/test.pdf /tmp/image-example.md && grep -q "Test PDF content" /tmp/image-example.md'
      - name: Check publication configuration
        id: publication
        shell: bash
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$HUB_USERNAME" ] || [ -z "$HUB_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Image tests passed. Docker Hub publication skipped: configure secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$HUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo 'Invalid IMAGE_NAME: use lowercase namespace/repository.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Image tests passed. Publication skipped because main has advanced; its newer run will publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Login after all validation passes
        if: steps.publication.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the exact tested image
        if: steps.publication.outputs.ready == 'true'
        shell: bash
        env:
          HUB_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for tag in "sha-$GITHUB_SHA" latest; do
            docker tag markdownify-remote:publish-candidate "$HUB_IMAGE:$tag"
            docker push "$HUB_IMAGE:$tag"
          done
          echo "Published tested linux/amd64 image: $HUB_IMAGE:sha-$GITHUB_SHA and $HUB_IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"

