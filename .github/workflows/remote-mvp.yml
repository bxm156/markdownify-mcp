name: Remote MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Node 24 is the image default; Node 22 stays covered until engines.node moves past it.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Pin the Node the smoke scripts and Node-subprocess tests spawn; the runner default drifts.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Node-only tests skip when node is missing; fail loudly if this leg runs another major.
      - name: Check the Node major on PATH
        shell: bash
        run: |
          actual="$(node --version)"
          echo "node $actual"
          case "$actual" in
            "v${{ matrix.node }}."*) ;;
            *) echo "::error::Expected Node ${{ matrix.node }}.x on PATH, got $actual"; exit 1 ;;
          esac
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Type-check tests, scripts and examples
        run: bun run typecheck
      - name: Check that every MD_* variable in src/remote is in docs/REMOTE.md
        run: bun scripts/check-env-docs.ts
      - name: Reject assert statements in Python scripts (python -O strips them)
        run: |
          # Parses each file, so the word "assert" in a comment, docstring or string is not flagged,
          # while `assert x`, `assert(x)` and `if y: assert x` all are.
          python - scripts/*.py mkdocs_hooks.py <<'PY'
          import ast, sys
          found = [f"{path}:{node.lineno}" for path in sys.argv[1:]
                   for node in ast.walk(ast.parse(open(path, encoding="utf-8").read(), path))
                   if isinstance(node, ast.Assert)]
          for place in found:
              print(f"::error file={place.split(':')[0]},line={place.split(':')[1]}::Use an explicit raise instead of assert (python -O strips it)")
          sys.exit(1 if found else 0)
          PY
      - run: bun run build:remote
      - run: bun test src/remote
      - run: python -m pip install 'markitdown[pdf,docx,xlsx,pptx]==0.1.5'
      - name: Build stdio server
        run: bun run build
      - name: Run full test suite (stdio and remote)
        run: bun test
        env:
          MD_TEST_NETWORK: "1"
      - name: Test the Office fixture generator (real DOCX, XLSX and PPTX files)
        run: |
          python scripts/create_remote_fixtures_test.py
          python -O scripts/create_remote_fixtures_test.py
      - run: bun scripts/remote-converter-smoke.ts
      - name: Verify compiled Node JWT authentication and scoped uploads
        run: bun scripts/jwt-http-smoke.ts
      # The smoke inherits NODE_OPTIONS into the compiled server it spawns, so any
      # deprecated Node API the server reaches on this major throws and fails the run.
      - name: Verify the compiled server reaches no deprecated Node API
        run: bun scripts/jwt-http-smoke.ts
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: Verify LiteLLM 1.104 anonymous health session
        run: |
          python -m pip install 'litellm[mcp]==1.104.0'
          python scripts/litellm-health-smoke.py
          python -O scripts/litellm-health-smoke.py
      - name: Verify LiteLLM health smoke rejects 403, 500, timeout and unexpected success
        run: python -O scripts/litellm_health_smoke_test.py
      - name: Build the remote image on this leg's Node
        run: docker build -f Dockerfile.remote --build-arg NODE_IMAGE=node:${{ matrix.node }}-bookworm-slim -t markdownify-remote:ci .
      - name: Check the image's Node version and shared libraries
        shell: bash
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint node markdownify-remote:ci -p process.version)"
          echo "image node $version"
          case "$version" in
            "v${{ matrix.node }}."*) ;;
            *) echo "::error::Image runs Node $version, expected ${{ matrix.node }}.x"; exit 1 ;;
          esac
          # node is copied from the node image into the python runtime image: every library must resolve there.
          libs="$(docker run --rm --entrypoint ldd markdownify-remote:ci /usr/local/bin/node)"
          echo "$libs"
          if grep -q 'not found' <<<"$libs"; then
            echo "::error::node in the runtime image has unresolved shared libraries"
            exit 1
          fi
      - name: Verify container HTTP upload workflow
        shell: bash
        run: |
          set -euo pipefail
          export MD_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$MD_API_KEY"
          trap 'docker rm -f -v markdownify-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name markdownify-ci -p 127.0.0.1:8000:8000 \
            -e MD_API_KEY -e MD_PUBLIC_BASE_URL=http://localhost:8000 markdownify-remote:ci
          bash scripts/wait-for-container.sh markdownify-ci
          MCP_TOKEN="$MD_API_KEY" bun scripts/remote-http-smoke.ts
          # The documented streaming helper (also shipped in the image) against the same container.
          example_output="$RUNNER_TEMP/upload-and-convert.md"
          MCP_TOKEN="$MD_API_KEY" CONVERSION_DEADLINE_MS=120000 \
            bun examples/upload-and-convert.ts src/sample-data/test.pdf "$example_output"
          grep -q 'Test PDF content' "$example_output"
          # The same helper under plain Node (no Bun, no src/), then the compiled copy inside the image.
          node_output="$RUNNER_TEMP/upload-and-convert-node.md"
          MCP_TOKEN="$MD_API_KEY" CONVERSION_DEADLINE_MS=120000 \
            node --experimental-strip-types --no-warnings examples/upload-and-convert.ts src/sample-data/test.pdf "$node_output"
          grep -q 'Test PDF content' "$node_output"
          docker run --rm --network container:markdownify-ci -e MCP_TOKEN="$MD_API_KEY" -e CONVERSION_DEADLINE_MS=120000 \
            -v "$PWD/src/sample-data:/in:ro" markdownify-remote:ci \
            sh -c 'node examples/upload-and-convert.js /in/test.pdf /tmp/image-example.md && grep -q "Test PDF content" /tmp/image-example.md'
      - name: Prepare disposable agent registry
        run: bun scripts/create-test-agent-registry.ts "$RUNNER_TEMP/markdownify-agents.json" "$GITHUB_ENV"
      - name: Verify container agent isolation
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f -v markdownify-agents-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name markdownify-agents-ci -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/markdownify-agents.json:/run/markdownify-agents.json:ro" \
            -e MD_AUTH_FILE=/run/markdownify-agents.json \
            -e MD_PUBLIC_BASE_URL=http://localhost:8000 markdownify-remote:ci
          bash scripts/wait-for-container.sh markdownify-agents-ci
          bun scripts/multitenant-http-smoke.ts
          # The documented streaming helper against the same multitenant container, as agent "a".
          # MD_TEST_AGENT_KEYS (JSON, masked) was exported by the registry step through GITHUB_ENV.
          example_output="$RUNNER_TEMP/multitenant-upload-and-convert.md"
          MCP_TOKEN="$(jq -r .a <<<"$MD_TEST_AGENT_KEYS")" CONVERSION_DEADLINE_MS=120000 \
            bun examples/upload-and-convert.ts src/sample-data/test.pdf "$example_output"
          grep -q 'Test PDF content' "$example_output"
  stdio-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Check shell script syntax
        shell: bash
        run: for f in scripts/*.sh setup.sh; do bash -n "$f"; done
      - name: Lint shell scripts with shellcheck
        shell: bash
        run: shellcheck -x scripts/*.sh setup.sh
      - name: Test the stdio smoke test's response waiting (no Docker needed)
        run: bash scripts/docker-smoke-test.test.sh
      - name: Validate compose files
        shell: bash
        run: |
          set -euo pipefail
          # Compose resolves env_file and bind sources: use the documented examples and a placeholder registry.
          # .dockerignore excludes .env.* and secrets, so these never reach an image build context.
          cp .env.remote.example .env.remote
          cp .env.multitenant.example .env.multitenant
          cp .env.jwt.example .env.jwt
          mkdir -p secrets
          printf '{"credentials":[]}\n' > secrets/agents.json
          for file in compose.remote.yaml compose.multitenant.yaml compose.jwt.yaml; do
            echo "Validating $file"
            docker compose -f "$file" config -q
          done
      - name: Build stdio image and convert a PDF over stdio
        run: bash scripts/docker-smoke-test.sh
        env:
          IMAGE: markdownify-mcp:ci
