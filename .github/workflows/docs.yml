name: Docs
on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - mkdocs_hooks.py
      - README.md
      - SKILL.md
      - PLAN.md
      # Repository files the docs link to; mkdocs_hooks.py checks they exist.
      - LICENSE
      - examples/**
      - compose*.yaml
      - .env*.example
      - .github/workflows/docker-publish.yml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - mkdocs_hooks.py
      - README.md
      - SKILL.md
      - PLAN.md
      # Repository files the docs link to; mkdocs_hooks.py checks they exist.
      - LICENSE
      - examples/**
      - compose*.yaml
      - .env*.example
      - .github/workflows/docker-publish.yml
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  # Silence Material for MkDocs' MkDocs 2.0 notice in build logs.
  NO_MKDOCS_2_WARNING: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Self-check the link rewriting hook
        run: python mkdocs_hooks.py
      - run: mkdocs build --strict
      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # Only pushes (or manual runs) on main publish; pull requests just build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Serialize deployments without cancelling one in progress. Kept on this
    # job so pull request builds never queue behind (or cancel) each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Attempts to enable Pages with the GitHub Actions source if needed.
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
