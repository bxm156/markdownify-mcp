name: Cross-platform
# Runs the stdio unit tests where the local-file code takes its non-Linux
# paths: no /proc/self/fd (the device/inode fallback), no O_NOFOLLOW on
# Windows. The real converter (markitdown, same pin as the other workflows) is
# installed so the converter-dependent tests run instead of skipping.
# Only the stdio server supports macOS and Windows. The remote server
# (src/remote) is Linux-only: it ships as a container image and refuses to
# start on Windows, so none of its tests run here.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # src/download.test.ts also runs a few checks under Node (type stripping).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'markitdown[pdf,docx,xlsx,pptx]==0.1.5'
      # pip puts markitdown (markitdown.exe on Windows) in the interpreter's Scripts/bin directory, which setup-python
      # adds to PATH; resolveMarkitdownPath falls back to the bare name and Bun.which resolves it via PATHEXT. Fail
      # here, not as silently skipped tests, if that ever stops being true.
      - name: Verify markitdown is found on PATH
        shell: bash
        run: |
          markitdown --version
          bun -e "if (!Bun.which('markitdown')) { console.error('markitdown is not on PATH'); process.exit(1); }"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      # tsc plus the platform-neutral chmod step (a no-op on Windows).
      - run: bun run build
      - run: bun test src/utils.test.ts src/Markdownify.test.ts src/download.test.ts src/server.test.ts src/tools.test.ts src/index.test.ts src/proxyWarning.test.ts
